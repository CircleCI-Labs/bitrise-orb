description: >
  Run a single Bitrise Step as its own CircleCI job, on an executor you choose
  explicitly (bitrise/macos or bitrise/machine -- see this orb's README for why there's
  no default). Wraps the `bitrise/step` command and forwards every one of its
  parameters, plus optional pre-steps/post-steps so you can interleave native CircleCI
  steps immediately before/after the Bitrise Step -- e.g. reading $BITRISE_IPA_PATH (or
  any other verbatim Bitrise output env var) that landed in $BASH_ENV.

parameters:
  executor:
    type: executor
    description: >
      Which executor to run this job on -- bitrise/macos (for Xcode-dependent Steps) or
      bitrise/machine (for everything else). Required, with no default: a Bitrise Step
      declares nothing machine-readable about needing macOS, so this orb won't guess --
      guessing wrong is either a confusing failure or ~10x the credit cost of a Linux job.
  checkout:
    type: boolean
    default: true
    description: Check out the project before running anything else in this job, including pre-steps.
  pre-steps:
    type: steps
    default: []
    description: Steps to run before the Bitrise Step (after checkout, if enabled).
  post-steps:
    type: steps
    default: []
    description: Steps to run after the Bitrise Step and its output export.
  id:
    type: string
    description: >
      The Bitrise Step reference, passed through to Bitrise verbatim -- no version
      resolution happens in this orb. Supports the full reference grammar:
      "<step-id>@<version>" (resolved against step-lib-source; omit "@<version>" for
      latest), "git::<url>@<ref>", or "path::<local-path>". Example: "xcode-archive@5".
  inputs:
    type: string
    default: ""
    description: >
      The Step's inputs, as a flat YAML block of "key: value" pairs, one Step input per
      line (values may be multi-line YAML block scalars). Run through `circleci env
      subst` before use, so "$MY_SECRET" resolves at runtime -- secrets never need to
      enter this config. Example: "project_path: MyApp.xcworkspace\nscheme: MyApp".
  outputs:
    type: string
    default: ""
    description: >
      Optional output aliases, as a flat YAML block of "ORIGINAL_OUTPUT_KEY: alias"
      pairs -- Bitrise's own config-level output-aliasing mechanism. Leave empty to
      export every declared output under its verbatim vendor name (the default).
  step-lib-source:
    type: string
    default: "https://github.com/bitrise-io/bitrise-steplib.git"
    description: The StepLib git URL to resolve "id" against when it has no explicit "<source>::" prefix and isn't a "git::"/"path::" reference.
  bitrise-version:
    type: string
    default: "latest"
    description: Version of the Bitrise CLI to install, or "latest".
  bin-dir:
    type: string
    default: "/tmp/bitrise-orb/bin"
    description: Directory this orb's own tooling (the bitrise CLI, yq) is installed into.
  cache-key-prefix:
    type: string
    default: "v1"
    description: Prefix applied to every cache key this orb writes. Bump it to force a clean cache.
  deploy-dir:
    type: string
    default: "/tmp/bitrise-orb/deploy"
    description: >
      Directory exported as $BITRISE_DEPLOY_DIR. Point store_artifacts/store_test_results
      at this path in a post-steps step to publish whatever the Step deposited there.
  extra-env:
    type: string
    default: ""
    description: >
      Extra or override environment variables to export before the Step runs, as a flat
      "NAME: value" YAML block (one pair per line, single-line values only). Applied
      after this orb's built-in CircleCI -> Bitrise mapping, so entries here win.
  skip-default-env-mapping:
    type: boolean
    default: false
    description: Skip this orb's built-in CircleCI -> Bitrise environment variable mapping entirely.
  config-path:
    type: string
    default: ".bitrise-orb.generated.yml"
    description: Where the synthesized, throwaway bitrise.yml is written.
  workflow-name:
    type: string
    default: "orb-step"
    description: Name of the single workflow inside the synthesized bitrise.yml.
  skip-install:
    type: boolean
    default: false
    description: Skip installing the Bitrise CLI (e.g. a pre-steps step already did).
  skip-map-env:
    type: boolean
    default: false
    description: Skip exporting the CircleCI -> Bitrise environment mapping (e.g. a pre-steps step already did).
  skip-collect-outputs:
    type: boolean
    default: false
    description: Skip discovering and exporting the Step's declared outputs.

executor: <<parameters.executor>>

steps:
  - when:
      condition: <<parameters.checkout>>
      steps:
        - checkout
  - <<parameters.pre-steps>>
  - step:
      checkout: false
      id: <<parameters.id>>
      inputs: <<parameters.inputs>>
      outputs: <<parameters.outputs>>
      step-lib-source: <<parameters.step-lib-source>>
      bitrise-version: <<parameters.bitrise-version>>
      bin-dir: <<parameters.bin-dir>>
      cache-key-prefix: <<parameters.cache-key-prefix>>
      deploy-dir: <<parameters.deploy-dir>>
      extra-env: <<parameters.extra-env>>
      skip-default-env-mapping: <<parameters.skip-default-env-mapping>>
      config-path: <<parameters.config-path>>
      workflow-name: <<parameters.workflow-name>>
      skip-install: <<parameters.skip-install>>
      skip-map-env: <<parameters.skip-map-env>>
      skip-collect-outputs: <<parameters.skip-collect-outputs>>
  - <<parameters.post-steps>>
