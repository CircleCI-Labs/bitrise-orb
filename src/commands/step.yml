description: >
  Run exactly one Bitrise Step inside this job, using the Bitrise CLI locally -- no
  bitrise.io account or token. Composes this orb's install / create-config / map-env /
  collect-outputs / run-bitrise commands in the one order that makes the whole thing work
  end to end, then owns its own lifecycle by default: a `store_artifacts` step against
  deploy-dir and a `store_test_results` step against test-results-dir, each independently
  disable-able. Each stage can be individually skipped so a future multi-Step orb call can
  reuse an already-installed CLI or an already-applied env mapping within the same job
  without a breaking change to this command's shape. Most users should reach for the
  `bitrise/step` job instead, which wraps this command with an explicit executor choice;
  use this command directly if you're composing it into a hand-rolled job of your own --
  e.g. to interleave native CircleCI steps with a Bitrise Step, or to chain several Bitrise
  Steps that share on-disk/keychain state. Native CircleCI `pre-steps:`/`post-steps:` (at
  the job-invocation call site) cover interleaving native steps around a `bitrise/step`
  job; see the README for the pattern, including the caveat that `pre-steps` run before
  even this command's own `checkout`.

parameters:
  checkout:
    type: boolean
    default: true
    description: Check out the project before running anything else. Disable if you've already checked out earlier in this job (e.g. the bitrise/step job already did).
  id:
    type: string
    description: >
      The Bitrise Step reference, passed through to Bitrise verbatim -- no version
      resolution happens in this orb. Supports the full reference grammar:
      "<step-id>@<version>" (resolved against step-lib-source; omit "@<version>" for
      latest), "git::<url>@<ref>", or "path::<local-path>". Example: "xcode-archive@6".
  inputs:
    type: string
    default: ""
    description: >
      The Step's inputs, as a flat YAML block of "key: value" pairs, one Step input per
      line (values may be multi-line YAML block scalars). Run through `circleci env
      subst` before use, so "$MY_SECRET" resolves at runtime -- secrets never need to
      enter this config. Example: "project_path: MyApp.xcworkspace\nscheme: MyApp".
  outputs:
    type: string
    default: ""
    description: >
      Optional output aliases, as a flat YAML block of "ORIGINAL_OUTPUT_KEY: alias"
      pairs -- Bitrise's own config-level output-aliasing mechanism. Leave empty to
      export every declared output under its verbatim vendor name (the default).
  extra-outputs:
    type: string
    default: ""
    description: >
      Additional environment variable NAMES (one per line, no values) to export
      verbatim, unioned with the Step's declared outputs. Use this for a Step whose
      step.yml declares no outputs but whose own code still calls `envman add` for one
      -- e.g. a `script@1` Step -- since this orb only auto-discovers DECLARED outputs
      by default. See the README's "Outputs" section.
  step-lib-source:
    type: string
    default: "https://github.com/bitrise-io/bitrise-steplib.git"
    description: The StepLib git URL to resolve "id" against when it has no explicit "<source>::" prefix and isn't a "git::"/"path::" reference.
  bitrise-version:
    type: string
    default: "latest"
    description: Version of the Bitrise CLI to install, or "latest".
  bin-dir:
    type: string
    default: "/tmp/bitrise-orb/bin"
    description: Directory this orb's own tooling (the bitrise CLI, yq) is installed into.
  cache-key-prefix:
    type: string
    default: "v1"
    description: Prefix applied to every cache key this orb writes. Bump it to force a clean cache.
  deploy-dir:
    type: string
    default: "/tmp/bitrise-orb/deploy"
    description: >
      Directory exported as $BITRISE_DEPLOY_DIR. This orb's `store-artifacts` default
      already runs `store_artifacts` against this exact path for you.
  store-artifacts:
    type: boolean
    default: true
    description: >
      Automatically run `store_artifacts` against deploy-dir after the Step, so the Step
      owns publishing whatever it deposited there with zero extra config -- this orb's
      lifecycle, not something you're expected to check in yourself. Disable if you'd
      rather call `store_artifacts` yourself (e.g. to rename/redirect it in the CircleCI
      UI), or if you're calling this command more than once in the same job and only
      want the artifact upload after the last call.
  test-results-dir:
    type: string
    default: "/tmp/bitrise-orb/test-results"
    description: >
      Directory exported as $BITRISE_TEST_DEPLOY_DIR -- Bitrise's own, distinct "root
      directory for all test results" (JUnit XML). This orb's `store-test-results`
      default already runs `store_test_results` against this exact path for you. Only
      certain Steps (android-unit-test, xcode-test, and similar) actually populate it --
      an arbitrary third-party Step may write nothing here, which is a silent no-op.
  store-test-results:
    type: boolean
    default: true
    description: >
      Automatically run `store_test_results` against test-results-dir after the Step.
      Disable if you'd rather call `store_test_results` yourself, or if you're calling
      this command more than once in the same job and only want it after the last call.
  extra-env:
    type: string
    default: ""
    description: >
      Extra or override environment variables to export before the Step runs, as a flat
      "NAME: value" YAML block (one pair per line, single-line values only). Applied
      after this orb's built-in CircleCI -> Bitrise mapping, so entries here win.
  skip-default-env-mapping:
    type: boolean
    default: false
    description: Skip this orb's built-in CircleCI -> Bitrise environment variable mapping entirely.
  config-path:
    type: string
    default: ".bitrise-orb.generated.yml"
    description: Where the synthesized, throwaway bitrise.yml is written.
  workflow-name:
    type: string
    default: "orb-step"
    description: Name of the single workflow inside the synthesized bitrise.yml.
  skip-install:
    type: boolean
    default: false
    description: Skip installing the Bitrise CLI (e.g. an earlier orb step in this job already did).
  skip-map-env:
    type: boolean
    default: false
    description: Skip exporting the CircleCI -> Bitrise environment mapping (e.g. an earlier orb step in this job already did).
  skip-collect-outputs:
    type: boolean
    default: false
    description: Skip discovering and exporting the Step's declared outputs.

steps:
  - when:
      condition: <<parameters.checkout>>
      steps:
        - checkout
  - when:
      condition:
        not: <<parameters.skip-install>>
      steps:
        - install:
            bitrise-version: <<parameters.bitrise-version>>
            bin-dir: <<parameters.bin-dir>>
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - create-config:
      id: <<parameters.id>>
      inputs: <<parameters.inputs>>
      outputs: <<parameters.outputs>>
      step-lib-source: <<parameters.step-lib-source>>
      config-path: <<parameters.config-path>>
      workflow-name: <<parameters.workflow-name>>
  - when:
      condition:
        not: <<parameters.skip-map-env>>
      steps:
        - map-env:
            deploy-dir: <<parameters.deploy-dir>>
            test-results-dir: <<parameters.test-results-dir>>
            extra-env: <<parameters.extra-env>>
            skip-default-mapping: <<parameters.skip-default-env-mapping>>
  - when:
      condition:
        not: <<parameters.skip-collect-outputs>>
      steps:
        - collect-outputs:
            id: <<parameters.id>>
            outputs: <<parameters.outputs>>
            extra-outputs: <<parameters.extra-outputs>>
            step-lib-source: <<parameters.step-lib-source>>
            config-path: <<parameters.config-path>>
            workflow-name: <<parameters.workflow-name>>
  - run-bitrise:
      config-path: <<parameters.config-path>>
      workflow-name: <<parameters.workflow-name>>
  - when:
      condition: <<parameters.store-artifacts>>
      steps:
        - store_artifacts:
            path: <<parameters.deploy-dir>>
  - when:
      condition: <<parameters.store-test-results>>
      steps:
        - store_test_results:
            path: <<parameters.test-results-dir>>
