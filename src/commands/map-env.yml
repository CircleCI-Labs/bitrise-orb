description: >
  Export the CircleCI -> Bitrise environment variable mapping into $BASH_ENV (so it's
  live for every subsequent step in this job, including the Step Bitrise itself runs),
  create the $BITRISE_DEPLOY_DIR directory, and apply any extra/override variables.

parameters:
  deploy-dir:
    type: string
    default: "/tmp/bitrise-orb/deploy"
    description: >
      Directory created and exported as $BITRISE_DEPLOY_DIR. Point store_artifacts /
      store_test_results at this path in a later step to publish whatever the Step
      deposited there -- this is this orb's equivalent of deploy-to-bitrise-io.
  extra-env:
    type: string
    default: ""
    description: >
      Extra or override environment variables to export before the Step runs, as a flat
      "NAME: value" YAML block (one pair per line, single-line values only). Applied
      after the built-in CircleCI -> Bitrise mapping below, so entries here win --
      this is how you add to or override any of that built-in mapping.
  skip-default-mapping:
    type: boolean
    default: false
    description: Skip this orb's built-in CircleCI -> Bitrise environment variable mapping entirely (extra-env, if any, still applies).

steps:
  - run:
      name: "Mapping CircleCI environment onto Bitrise's"
      environment:
        ORB_VAL_DEPLOY_DIR: <<parameters.deploy-dir>>
        ORB_VAL_EXTRA_ENV: <<parameters.extra-env>>
        ORB_VAL_SKIP_DEFAULT_MAPPING: <<parameters.skip-default-mapping>>
      command: <<include(scripts/map-env.sh)>>
