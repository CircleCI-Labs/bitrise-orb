description: >
  A Linux machine executor for a Bitrise Step that doesn't need macOS/Xcode (Android
  signing, most fastlane/Gradle/Flutter work, plain script Steps). There is no default
  `bitrise/executor` for this orb -- see the bitrise/macos executor and this repo's
  README for why. Must be an x86_64/amd64 resource class: the Bitrise CLI has no Linux
  arm64 release (bitrise-io/bitrise's GitHub releases publish only a Linux x86_64
  asset), and this orb's install command fails fast with a clear error rather than let
  that surface as a confusing download 404 if you point it at an arm resource class.

parameters:
  image:
    type: string
    default: "ubuntu-2204:current"
    description: Machine executor image. Must resolve to an x86_64/amd64 image.
  resource-class:
    type: string
    default: "medium"
    description: CircleCI machine resource class. Must be an x86_64/amd64 class (not one of CircleCI's arm resource classes).
  docker-layer-caching:
    type: boolean
    default: false
    description: Enable Docker layer caching for this executor (only useful if pre-steps/post-steps you add also use Docker).

machine:
  image: <<parameters.image>>
  docker_layer_caching: <<parameters.docker-layer-caching>>
resource_class: <<parameters.resource-class>>
